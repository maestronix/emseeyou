name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --package-lock-only
      - run: npm ci
      - run: npm run build
      - name: Verify production bundle
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          compgen -G 'dist/assets/*.js' >/dev/null
          compgen -G 'dist/assets/*.css' >/dev/null

          # Vite must rewrite the source entrypoint to generated, base-prefixed assets.
          if grep -Eq 'src="/src/main[.]tsx"|src="/src/main[.]ts"' dist/index.html; then
            echo "::error::Production HTML still references the source entrypoint."
            exit 1
          fi
          grep -Eq 'src="/emseeyou/assets/[^"]+[.]js"' dist/index.html
          grep -Eq 'href="/emseeyou/assets/[^"]+[.]css"' dist/index.html
          echo "Production HTML references generated assets under /emseeyou/assets/."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
